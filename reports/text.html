<!DOCTYPE html>
<html lang="zh-Hant-tw">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>我們的專題報告</title>
    <style>
        input[type="search"] {
            width: 200px;
            height: 30px;
            padding: 5px;
            border: 1px solid #ccc;
        }

        label {
            display: block;
            margin-bottom: 5px;
        }

        button {
            padding: 5px 10px;
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
  </head>

  <body>
    <h1>哈哈哈</h1>
    <form action="/search">
        <label for="site-search">本大爺來搜尋了:</label>
        <input type="search" id="site-search" name="q">
        <button type="submit">你搜阿</button>
    </form>
  </body>
</html>
